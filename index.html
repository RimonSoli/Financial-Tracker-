<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family Cashflow</title>
<meta name="description" content="Family cashflow forecast: bills, cards and balances, years ahead.">
<meta name="theme-color" content="#1D5466">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cashflow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one column app shell — cash header, sticky tabs, view; bottom sheets for editing */
:root{
  --bg:#EDF1F0;--surface:#FFFFFF;--sunk:#E3E9E7;--ink:#14212A;--muted:#58686F;--line:#D3DBD9;
  --accent:#1D5466;--accent-ink:#FFFFFF;--accent-soft:#D6E7EC;--sav:#6A4E9A;
  --big:#E8641E;--big-edge:#B94A0F;--big-ink:#FFFFFF;--bigin:#2C7A4C;--bigin-ink:#FFFFFF;
  --hero:#D9561A;--hero-soft:#FDEEE5;--est:#2E5E9E;--est-soft:#E3ECF8;
  --c-in:var(--good);--c-bill:var(--ink);--c-500:var(--warn);--c-card:var(--bad);--c-xfer:var(--sav);
  --good:#2C7A4C;--good-soft:#DCEFE3;--warn:#A86E14;--warn-soft:#F6E9CF;--bad:#B23636;--bad-soft:#F6DCDA;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Public Sans",ui-sans-serif,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F171A;--surface:#162126;--sunk:#1C2A30;--ink:#E2EBEE;--muted:#90A2A9;--line:#27373D;
  --accent:#6DB2C7;--accent-ink:#0C1A1F;--accent-soft:#1E3A44;--sav:#B59BE3;--big:#E8742E;--big-edge:#FF9A5C;--big-ink:#1A0D05;--hero:#F08A4B;--hero-soft:#3A2416;--est:#8DB4EA;--est-soft:#1D2C40;
  --good:#61C089;--good-soft:#173A27;--warn:#E3A84C;--warn-soft:#3D2E14;--bad:#E87470;--bad-soft:#431E1E;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F171A;--surface:#162126;--sunk:#1C2A30;--ink:#E2EBEE;--muted:#90A2A9;--line:#27373D;
  --accent:#6DB2C7;--accent-ink:#0C1A1F;--accent-soft:#1E3A44;--sav:#B59BE3;--big:#E8742E;--big-edge:#FF9A5C;--big-ink:#1A0D05;--hero:#F08A4B;--hero-soft:#3A2416;--est:#8DB4EA;--est-soft:#1D2C40;
  --good:#61C089;--good-soft:#173A27;--warn:#E3A84C;--warn-soft:#3D2E14;--bad:#E87470;--bad-soft:#431E1E;color-scheme:dark}
:root[data-theme="light"]{color-scheme:light}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);margin:0;-webkit-tap-highlight-color:transparent}
img{max-width:100%}[hidden]{display:none!important}
html{background:var(--bg)}
.status{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);margin-left:8px}
.status i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.status.on i{background:var(--good)}.status.off i{background:var(--warn)}
.gate .tabs,.gate #banner,.gate #undoBanner,.gate .accts,.gate .bal,.gate .top .label,.gate #nwBtn,.gate #gear,.gate #bell{display:none!important}
.gatebox{max-width:440px;margin:40px auto;text-align:center;display:grid;gap:12px;justify-items:center}
.gatebox .big{font-family:var(--f-display);font-size:24px;font-weight:700}
.spin{width:28px;height:28px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--accent);animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}
.viewer [data-tab="man"],.viewer [data-act="startRep"],.viewer [data-act="editCard"],.viewer [data-act="editNW"],.viewer [data-act="recon"],.viewer [data-act="edit"],.viewer [data-act="editEst"],.viewer [data-act="editAcct"]{display:none!important}
.role{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:12px 64px}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0}
h3{font-size:16px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.muted{color:var(--muted)}
.small{font-size:12px}
.label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-block:8px 14px}
.top .app{font-family:var(--f-display);font-weight:500;font-size:15px;color:var(--muted)}
.bal{font-family:var(--f-mono);font-size:clamp(30px,8vw,42px);font-weight:600;line-height:1.1;letter-spacing:-.02em}
.accts{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;margin-top:4px}
.accts b{font-family:var(--f-mono);font-weight:600}
.topr{display:flex;flex-direction:column;align-items:flex-end;gap:12px;flex:none}
.nwbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:8px 14px;color:var(--ink);display:grid;justify-items:end;gap:1px;text-align:right}
.nwbtn b{font:600 17px var(--f-mono);white-space:nowrap}
.nwbtn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nwbtn[aria-pressed="true"] .label{color:var(--bg);opacity:.75}
.nwbar{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--sunk)}
.nwbar i{display:block;height:100%}
.sw{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:1px}
.sub{font-size:13px;color:var(--muted);margin-top:4px}
.sub b{color:var(--ink);font-weight:600}
.hbtns{display:flex;gap:8px;flex:none}
.ib{position:relative;width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center}
.ib svg{width:21px;height:21px}
.ib.on{border-color:var(--bad);color:var(--bad)}.ib.on.soft{border-color:var(--warn);color:var(--warn)}
.ib[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.badge{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;padding:0 5px;border-radius:10px;background:var(--bad);color:#fff;font:600 11px/20px var(--f-mono);text-align:center}
.badge.soft{background:var(--warn)}
.banner{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;background:var(--accent-soft);border-radius:10px;padding:10px 12px;font-size:13px;margin-bottom:12px}

.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;gap:2px;background:var(--bg);padding-block:6px;margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs button{flex:1 0 auto;border:0;background:transparent;padding:9px 12px;border-radius:8px;font-weight:600;font-size:14px;color:var(--muted)}
.tabs button[aria-selected="true"]{background:var(--ink);color:var(--bg)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px}
.stack{display:grid;gap:12px}
.stack>*{min-width:0}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.wrapr{flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.link{border:0;background:none;padding:4px 0;color:var(--accent)}
.chip{display:inline-block;font-size:11px;font-weight:600;padding:2px 7px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.s{color:var(--sav)}
.pos{color:var(--good)}.neg{color:var(--bad)}

.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 12px;border-radius:6px;font-weight:600;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink)}
.cardseg button{color:var(--ink);display:inline-flex;align-items:center;gap:5px}
.cardseg button:hover{background:var(--surface)}
.cardseg svg{color:var(--muted)}

.chart svg{width:100%;height:auto;display:block}
.chart .ax{fill:var(--muted);font:10px var(--f-mono)}

.months{display:grid;gap:14px}
.month h3{font-size:18px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.month h3 span{font:12px var(--f-mono);color:var(--muted);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.dow{font-size:10px;text-align:center;color:var(--muted);font-weight:600;padding-bottom:2px}
.day{border:0;background:var(--sunk);border-radius:6px;min-height:72px;padding:4px 3px;display:flex;flex-direction:column;align-items:stretch;text-align:left;gap:1px;min-width:0}
.day .d{font-size:11px;line-height:1.35;font-weight:600;display:flex;justify-content:space-between;align-items:baseline;gap:2px;min-width:0}
.day .v{font:10px var(--f-mono);color:var(--muted);margin-top:auto;overflow:hidden;text-overflow:clip;white-space:nowrap}
.day.low{background:var(--warn-soft)}.day.low .v{color:var(--warn)}
.day.negb{background:var(--bad-soft)}.day.negb .v{color:var(--bad)}
.day.bigday{background:var(--big);box-shadow:inset 0 0 0 1px var(--big-edge)}
.day.bigday .d,.day.bigday .it,.day.bigday .it .a,.day.bigday .it.big .a,.day.bigday .tag{color:var(--big-ink)!important}
.day.bigin{background:var(--bigin);box-shadow:inset 0 0 0 1px var(--bigin)}
.day.bigin .d,.day.bigin .it,.day.bigin .it .a,.day.bigin .it.big .a,.day.bigin .tag{color:var(--bigin-ink)!important}
.day.bigday .dot,.day.bigin .dot{box-shadow:0 0 0 1px rgb(255 255 255/.7)}
.day.past{opacity:.45}
.day.today{outline:2px solid var(--accent);outline-offset:-2px}
.month h3 span b{color:var(--ink);font-weight:600}
.mfoot{text-align:right;font:12px var(--f-mono);color:var(--muted);margin-top:8px}
.mfoot b{color:var(--ink);font-weight:600;font-size:13px}
.day .tags{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:0 3px;min-width:0;margin-left:4px}
.day .tag{font-size:7.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);line-height:1.2}
.day .tag.pay{color:var(--bad)}
.day.p0{background:var(--sunk)}.day.p1{background:var(--accent-soft)}
.stmt{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 10px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px;margin-top:8px}
.stmt b{color:var(--ink)}
.day.has .v{color:var(--ink);font-weight:600}
.day .it{display:flex;gap:2px;font-size:9px;line-height:1.25;min-width:0;color:var(--c-bill)}
.day .it .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.day .it .a{font-family:var(--f-mono);flex:none}
.day .it.in{color:var(--c-in)}.day .it.bill{color:var(--c-card)}.day .it.sv{color:var(--c-xfer)}.day .it.big .a{color:var(--c-500);font-weight:600}
.tagchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted)}
.tagchip i,.sw2{display:inline-block;width:9px;height:9px;border-radius:50%;flex:none}
.crow{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.swb{width:40px;height:32px;border-radius:8px;border:1px solid var(--line);box-shadow:inset 0 0 0 2px var(--surface);flex:none;padding:0}
.pk{position:fixed;inset:0;z-index:30;background:rgb(0 0 0/.5);display:flex;align-items:flex-end;justify-content:center}
.pk>div{background:var(--surface);width:100%;max-width:420px;max-height:94%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));display:grid;gap:12px}
@media (min-width:640px){.pk{align-items:center}.pk>div{border-radius:16px}}
.pksv{position:relative;height:210px;border-radius:10px;touch-action:none;cursor:crosshair;background-image:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,transparent)}
.hue{position:relative;height:22px;border-radius:11px;touch-action:none;cursor:pointer;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.th{position:absolute;width:22px;height:22px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgb(0 0 0/.35),0 2px 6px rgb(0 0 0/.35);transform:translate(-50%,-50%);pointer-events:none}
.hue .th{top:50%}
.pv{display:flex;border-radius:8px;overflow:hidden;border:1px solid var(--line);flex:none}
.pv i{display:block;width:34px;height:34px}
.pkhex{width:100px;font:600 15px var(--f-mono);padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);text-transform:uppercase}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:6px}
.pal button{position:relative;aspect-ratio:1;max-width:100%;border-radius:8px;border:1px solid var(--line);padding:0}
.pal button.on{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.pal button span{position:absolute;top:-6px;right:-6px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:12px;line-height:18px}
.pksv:focus-visible,.hue:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.crow input[type=text]{flex:1;min-width:0;font:inherit;padding:7px 9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.dots{display:flex;gap:2px;flex-wrap:wrap;margin-top:auto}
.dot{width:6px;height:6px;border-radius:50%;background:var(--c-bill)}
.dot.in{background:var(--c-in)}.dot.bill{background:var(--c-card)}.dot.big{background:var(--c-500)}.dot.sv{background:var(--c-xfer)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

.list{display:grid}
.li{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-top:1px solid var(--line);align-items:start}
.li:first-child{border-top:0}
.li .date{font:12px/1.3 var(--f-mono);color:var(--muted)}
.li .date b{display:block;font-size:16px;color:var(--ink)}
.li .nm{font-weight:600;min-width:0}
.li .meta{font-size:12px;color:var(--muted)}
.li .amt{text-align:right;font:600 14px var(--f-mono)}
.li .after{font:11px var(--f-mono);color:var(--muted);text-align:right;white-space:nowrap}
.nmb{border:0;background:none;padding:0;text-align:left;font:inherit;font-weight:600;display:block}
.nmb .pen{font-size:11px;font-weight:600;color:var(--accent);white-space:nowrap}
.li.trough{background:var(--warn-soft);margin-inline:-14px;padding-inline:14px}

.cat{border-top:1px solid var(--line);padding:10px 0}
.cat:first-child{border-top:0}
.cat>button{width:100%;border:0;background:none;padding:0;text-align:left;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
.bar{grid-column:1/3;height:6px;border-radius:3px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.sublist{display:grid;gap:4px;margin-top:8px;padding-left:10px;font-size:13px}
.sublist div{display:flex;justify-content:space-between;gap:10px}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpi{background:var(--sunk);border-radius:10px;padding:10px;min-width:0}
.kpi .num{font-size:17px;font-weight:600}

.ccard{display:grid;gap:10px}
.plastic{border-radius:12px;padding:14px;background:var(--ink);color:var(--bg);display:flex;justify-content:space-between;align-items:flex-end;gap:10px;min-height:86px}
.plastic .nm{font-family:var(--f-display);font-size:18px;font-weight:700}
.plastic>.num{white-space:nowrap}
.check{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line)}
.check input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.check.done span{text-decoration:line-through;color:var(--muted)}
button.check{width:100%;border-left:0;border-right:0;border-bottom:0;background:none;text-align:left}
.prog{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--good)}
.est{display:grid;grid-template-columns:minmax(0,1fr) 120px;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.est:first-of-type{border-top:0}
.est .nm{border:0;background:none;padding:0;text-align:left;min-width:0}
.money-in{position:relative}
.money-in span{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--muted);font:14px var(--f-mono)}
.money-in input{width:100%;font:600 15px var(--f-mono);text-align:right;padding:8px 10px 8px 22px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.money-in input::placeholder{color:var(--muted);opacity:.55;font-weight:400}
.money-in.hero span{left:14px;font:700 22px var(--f-mono);color:var(--hero)}
.money-in.hero input{font:700 24px var(--f-mono);text-align:left;padding:12px 14px 12px 34px;border:2px solid var(--hero);background:var(--hero-soft)}
.money-in.hero input:focus-visible{outline:3px solid var(--hero);outline-offset:2px}
.hero-f label{color:var(--hero);font-size:13px;font-weight:700;letter-spacing:.02em}
.mest{display:grid;gap:3px;margin-top:10px;padding:8px 10px;border-radius:8px;background:var(--est-soft);font-size:13px}
.mest .label{color:var(--est)}
.er{display:flex;justify-content:space-between;gap:10px}
.er b{color:var(--est);font-weight:600}
.er.tot{border-top:1px solid var(--line);padding-top:3px;margin-top:2px;font-weight:600}
.est-l{margin-top:6px;color:var(--est)}
.estlist{display:grid;gap:4px}
.estrow{display:flex;align-items:center;gap:10px;width:100%;border:0;border-left:3px solid var(--est);border-radius:6px;background:var(--est-soft);color:var(--est);padding:8px 10px;text-align:left;font-size:14px}
.estrow .num{font-weight:600}
.moreb{justify-self:center}
.erase{display:grid;gap:10px;padding:12px;border:1px solid var(--bad);border-radius:10px;background:var(--bad-soft)}
.note-box{padding:10px 12px;border-radius:8px;background:var(--warn-soft);font-size:13px}
.banner.undo{background:var(--bad-soft)}
.saved{font-size:11px;color:var(--good);text-align:right;grid-column:2}

.note{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.note:first-child{border-top:0}
.note .stripe{border-radius:2px;background:var(--warn)}
.note.urgent .stripe{background:var(--bad)}
.note.read{opacity:.5}

.sheet{position:fixed;inset:0;z-index:20;background:rgb(0 0 0/.45);display:flex;align-items:flex-end;justify-content:center}
.sheet>div{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:16px 16px 0 0;padding:18px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:640px){.sheet{align-items:center}.sheet>div{border-radius:16px}}
.field{display:grid;gap:4px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.x{border:0;background:var(--sunk);width:32px;height:32px;border-radius:50%;font-size:18px;line-height:1}
.result{border-radius:12px;padding:14px}
.result.good{background:var(--good-soft)}.result.bad{background:var(--bad-soft)}.result.even{background:var(--accent-soft)}
.tscroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px 4px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
td:first-child,th:first-child{text-align:left}
th{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
@media (max-width:420px){.kpis{grid-template-columns:1fr 1fr}.kpis .kpi:last-child:nth-child(odd){grid-column:1/3}.day{min-height:66px;padding:3px 2px}.day .it{font-size:8.5px}.fgrid{grid-template-columns:1fr}}
@media (prefers-reduced-motion:no-preference){.bar i,.prog i{transition:width .3s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div style="min-width:0">
      <div class="app">Family Cashflow<span class="status" id="status" hidden><i></i><span></span></span></div>
      <div class="label" style="margin-top:6px">Total cash today</div>
      <div class="bal" id="hBal"></div>
      <div class="accts" id="hAcc"></div>
    </div>
    <div class="topr">
    <div class="hbtns">
      <button class="ib" id="gear" aria-label="Settings" data-act="settings" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
      </button>
      <button class="ib" id="bell" aria-label="Notifications" data-act="notes">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
        <span class="badge" id="badge" hidden></span>
      </button>
    </div>
    <button class="nwbtn" id="nwBtn" data-act="tabTo" data-t="nw" aria-pressed="false"></button>
    </div>
  </header>
  <div class="banner" id="banner" hidden>
    <span>You're looking at <b>example numbers</b>. Edit them under Manage, or start blank in Settings.</span>
  </div>
  <div class="banner undo" id="undoBanner" role="status" hidden></div>
  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="cal">Calendar</button>
    <button role="tab" data-tab="up">Upcoming</button>
    <button role="tab" data-tab="tot">Totals</button>
    <button role="tab" data-tab="cards">Cards</button>
    <button role="tab" data-tab="man">Manage</button>
  </nav>
  <main id="view"></main>
</div>
<div class="sheet" id="sheet" hidden><div id="sheetBody"></div></div>
<div class="pk" id="pk" hidden><div role="dialog" aria-modal="true" aria-labelledby="pkTitle">
  <div class="row between"><h2 id="pkTitle" style="font-size:20px">Choose a colour</h2><button class="x" data-act="pkCancel" aria-label="Close">×</button></div>
  <div class="pksv" id="pkSV" tabindex="0" role="slider" aria-label="Shade: left to right is more colour, top to bottom is darker"><span class="th" id="pkSVt"></span></div>
  <div class="hue" id="pkH" tabindex="0" role="slider" aria-label="Hue" aria-valuemin="0" aria-valuemax="360"><span class="th" id="pkHt"></span></div>
  <div class="row wrapr"><span class="pv" title="Before and after"><i id="pvOld"></i><i id="pvNew"></i></span><input class="pkhex" id="pkHex" maxlength="7" aria-label="Hex colour code" spellcheck="false"><button class="btn sm" data-act="pkSave">Save to palette</button></div>
  <div><div class="row between" style="margin-bottom:6px"><span class="label">Saved colours</span><button class="btn link small" data-act="pkEdit" id="pkEditBtn">Edit</button></div><div class="pal" id="pkPal"></div></div>
  <div class="row"><button class="btn primary" data-act="pkApply">Use this colour</button><button class="btn" data-act="pkCancel">Cancel</button></div>
</div></div>

<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script type="module" src="sync.js"></script>
</body>
</html>
